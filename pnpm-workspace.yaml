packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  nx: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# No resolver versiones con menos de 3 días en el registry (en minutos). Los paquetes
# comprometidos suelen detectarse y retirarse en horas: litellm 1.107.0 (PyPI, 21-oct-2026)
# duró menos de dos.
minimumReleaseAge: 4320

# Parches de seguridad en dependencias transitivas que el padre aún no pide.
overrides:
  proxy-addr: '>=2.0.8'
  follow-redirects: '>=1.16.1'
  form-data: '>=4.0.6'
  '@grpc/grpc-js': '>=1.14.5'
