syntax = "proto3";

package tesseract.agents.v1;

service AgentsService {
  rpc Execute(AgentExecutionRequest) returns (AgentExecutionResponse);
  rpc ExecuteStream(AgentExecutionRequest) returns (stream AgentStreamEvent);
  // Catálogo autodescriptivo de tipos de nodo (JSON Schema por tipo, puertos,
  // contrato de templates). Fuente de verdad para validar workflows al guardar
  // y para el futuro editor visual.
  rpc GetNodeCatalog(NodeCatalogRequest) returns (NodeCatalogResponse);
}

// ── Node catalog ──────────────────────────────────────────────────────────────

message NodeCatalogRequest {
  // Tipo de grafo (por ahora solo "pipeline"; vacío = todos los disponibles)
  string graph_type = 1;
}

message NodeCatalogResponse {
  // Catálogo serializado como JSON (estructura versionada por schema_version)
  string catalog_json = 1;
}

// ── Request ───────────────────────────────────────────────────────────────────

message AgentExecutionRequest {
  string tenant_id      = 1;
  string workflow_id    = 2;
  string conversation_id = 3;
  string user_type      = 4;
  string user_id        = 5;
  string channel        = 6;
  string user_message   = 7;

  // Flexible: pipeline evoluciona frecuentemente, se serializa como JSON string
  string graph_config = 8;

  map<string, AgentConfig>  agents_config        = 9;
  map<string, AgentToolMap> agent_tool_instances = 10;
  repeated Message          message_history      = 11;
  string                    user_metadata        = 12;
  string                    timezone             = 13;
}

message AgentConfig {
  string          model             = 1;
  optional float  temperature       = 2;  // opcional: omitido = no se envía al proveedor
  string          system_prompt     = 3;
  int32           max_tokens        = 4;
  repeated string fallbacks         = 5;
  int32           max_retries       = 6;
  int32           timeout           = 7;
  string          api_base          = 8;
  // Parámetros extra específicos del proveedor (JSON object), p.ej.
  // {"reasoning_effort":"none","verbosity":"low"}. Se mergean como model_kwargs
  // del LLM. Genérico: agregar un parámetro nuevo NO requiere tocar el proto.
  string          model_params_json = 9;
  // Signal tools declaradas por el agente (JSON array de {name, description, args?,
  // response?}). Viaja como JSON string (mismo idioma que graph_config). El motor
  // las construye vía tools.signals.load_signal_tools y las bindea al LLM.
  string          signal_tools_json = 10;
}

message AgentToolMap {
  map<string, ToolInstance> tools = 1;
}

message ToolInstance {
  string                 tool_name         = 1;
  string                 display_name      = 2;
  string                 config            = 3;  // JSON string, dinámico por herramienta
  repeated string        enabled_functions = 4;
  string                 credentials       = 5;  // JSON string, dinámico por herramienta
}

message Message {
  string role    = 1;
  string content = 2;
}

// ── Response ──────────────────────────────────────────────────────────────────

message AgentExecutionResponse {
  string            conversation_id = 1;
  repeated Message  messages        = 2;
  ExecutionMetadata metadata        = 3;
}

message ExecutionMetadata {
  int64                   execution_time_ms       = 1;
  string                  graph_type              = 2;
  int32                   agents_count            = 3;
  int64                   input_tokens            = 4;
  int64                   output_tokens           = 5;
  int64                   total_tokens            = 6;
  map<string, ModelUsage> usage_by_model          = 7;
  HumanHandoff            human_handoff_requested = 8;
  string                  variables_json          = 9;  // JSON string genérico: estado a persistir por el workflow
}

message ModelUsage {
  int64 input_tokens  = 1;
  int64 output_tokens = 2;
  int64 total_tokens  = 3;
}

message HumanHandoff {
  bool   requested = 1;
  string reason    = 2;
  string tool_name = 3;
}

// ── Streaming ─────────────────────────────────────────────────────────────────

message AgentStreamEvent {
  // token | tool_start | tool_end | metadata | end | error
  string type     = 1;
  string content  = 2;
  string metadata = 3;  // JSON string
}
