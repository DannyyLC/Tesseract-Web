steps:
  # ── Gateway ──────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-gateway'
    args:
      - build
      - -f
      - apps/gateway/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-gateway-sha'
    waitFor: ['build-gateway']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-gateway-latest'
    waitFor: ['build-gateway']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:latest

  # ── Agents ───────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-agents'
    args:
      - build
      - -f
      - apps/agents/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:latest
      - apps/agents

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-agents-sha'
    waitFor: ['build-agents']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-agents-latest'
    waitFor: ['build-agents']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:latest

  # ── Deploy a Cloud Run ────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-gateway'
    waitFor: ['push-gateway-sha']
    args:
      - gcloud
      - run
      - deploy
      - gateway
      - --image=us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --add-cloudsql-instances=fractal-tesseract:us-central1:tesseract-db
      # El worker de WhatsApp corre el workflow completo dentro de una request de
      # Cloud Tasks. Los 300s por defecto se quedan cortos: el propio workflow ya
      # tiene timeout de 300s, más transcripción y compactación.
      - --timeout=600
      # Explícito a propósito. `gcloud run deploy` CONSERVA las banderas que no se le
      # pasan, así que omitirla no garantiza nada: si alguien despliega una vez con
      # --no-cpu-throttling, se queda hasta que se revierta a mano. Con Cloud Tasks no
      # queda trabajo después del ACK, así que facturamos por request.
      - --cpu-throttling
      # Config no sensible, versionada en el repo. Ambas banderas REEMPLAZAN su conjunto
      # completo: lo que no esté declarado aquí se borra del servicio. Por eso la lista de
      # secretos va entera aunque algunos ya no se usen — se retiran en un commit aparte,
      # después de confirmar que el deploy declarativo quedó bien.
      - --env-vars-file=infrastructure/gcp/gateway.env.yaml
      # Los valores viven en Secret Manager; aquí solo va el nombre del secreto. Crear el
      # secreto y dar `roles/secretmanager.secretAccessor` a la SA del servicio sigue
      # siendo manual: meter el valor al repo es justo lo que esto evita.
      - >-
        --set-secrets=AGENTS_INTERNAL_SECRET=AGENTS_INTERNAL_SECRET:latest,COMPACTION_API_KEY=COMPACTION_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,DATASET_TOKEN_SECRET=DATASET_TOKEN_SECRET:latest,FACTURAPI_API_KEY=FACTURAPI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,MEDIA_PROCESSING_API_KEY=MEDIA_PROCESSING_API_KEY:latest,REDIS_URL=REDIS_URL:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_USER=SMTP_USER:latest,STRIPE_PRICE_BUSINESS=STRIPE_PRICE_BUSINESS:latest,STRIPE_PRICE_GROWTH=STRIPE_PRICE_GROWTH:latest,STRIPE_PRICE_OVERAGE=STRIPE_PRICE_OVERAGE:latest,STRIPE_PRICE_PRO=STRIPE_PRICE_PRO:latest,STRIPE_PRICE_STARTER=STRIPE_PRICE_STARTER:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:latest,SUPER_ADMIN_PASSWORD=SUPER_ADMIN_PASSWORD:latest,TEMP_TOKEN_SECRET=TEMP_TOKEN_SECRET:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest,Y_CLOUD_API_KEY=Y_CLOUD_API_KEY:latest,Y_CLOUD_WEBHOOK_SECRET=Y_CLOUD_WEBHOOK_SECRET:latest

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-agents'
    waitFor: ['push-agents-sha']
    args:
      - gcloud
      - run
      - deploy
      - agents
      - --image=us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --env-vars-file=infrastructure/gcp/agents.env.yaml
      # AGENTS_INTERNAL_SECRET debe coincidir con el del gateway. Las llaves de LLM las lee
      # litellm del entorno, sin referencia en el código: si esta línea se pierde, el
      # servicio arranca sano y falla en la primera ejecución de un workflow.
      - >-
        --set-secrets=AGENTS_INTERNAL_SECRET=AGENTS_INTERNAL_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest

images:
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:latest
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:latest

options:
  logging: CLOUD_LOGGING_ONLY
