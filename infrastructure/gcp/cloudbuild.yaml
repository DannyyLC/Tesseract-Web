steps:
  # ── Gateway ──────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-gateway'
    args:
      - build
      - -f
      - apps/gateway/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-gateway-sha'
    waitFor: ['build-gateway']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-gateway-latest'
    waitFor: ['build-gateway']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:latest

  # ── Agents ───────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-agents'
    args:
      - build
      - -f
      - apps/agents/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:latest
      - apps/agents

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-agents-sha'
    waitFor: ['build-agents']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-agents-latest'
    waitFor: ['build-agents']
    args:
      - push
      - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:latest

  # ── Deploy a Cloud Run ────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-gateway'
    waitFor: ['push-gateway-sha']
    args:
      - gcloud
      - run
      - deploy
      - gateway
      - --image=us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --add-cloudsql-instances=fractal-tesseract:us-central1:tesseract-db
      - --timeout=600
      - --cpu-throttling
      - --env-vars-file=infrastructure/gcp/gateway.env.yaml
      - >-
        --set-secrets=AGENTS_INTERNAL_SECRET=AGENTS_INTERNAL_SECRET:latest,COMPACTION_API_KEY=COMPACTION_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,DATASET_TOKEN_SECRET=DATASET_TOKEN_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,MEDIA_PROCESSING_API_KEY=MEDIA_PROCESSING_API_KEY:latest,MESSENGER_VERIFY_TOKEN=MESSENGER_VERIFY_TOKEN:latest,REDIS_URL=REDIS_URL:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_USER=SMTP_USER:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:latest,SUPER_ADMIN_PASSWORD=SUPER_ADMIN_PASSWORD:latest,TEMP_TOKEN_SECRET=TEMP_TOKEN_SECRET:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest,Y_CLOUD_API_KEY=Y_CLOUD_API_KEY:latest,Y_CLOUD_WEBHOOK_SECRET=Y_CLOUD_WEBHOOK_SECRET:latest

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-agents'
    waitFor: ['push-agents-sha']
    args:
      - gcloud
      - run
      - deploy
      - agents
      - --image=us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --env-vars-file=infrastructure/gcp/agents.env.yaml
      - >-
        --set-secrets=AGENTS_INTERNAL_SECRET=AGENTS_INTERNAL_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest

images:
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:$COMMIT_SHA
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/gateway:latest
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:$COMMIT_SHA
  - us-central1-docker.pkg.dev/fractal-tesseract/tesseract-repo/agents:latest

options:
  logging: CLOUD_LOGGING_ONLY
