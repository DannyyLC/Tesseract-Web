# Variables de entorno NO sensibles del servicio Cloud Run `gateway`.
#
# Este archivo es la fuente de verdad: se aplica con `--env-vars-file` desde
# cloudbuild.yaml. Los valores sensibles NO viven aquí — van en Secret Manager y se
# referencian con `--set-secrets` en el mismo paso de deploy.
#
# OJO: `--env-vars-file` REEMPLAZA el conjunto completo de variables planas. Lo que no
# esté en este archivo se borra del servicio en el siguiente deploy.
#
# Para comprobar que esto coincide con lo que hay desplegado:
#   pnpm run env:diff gateway

